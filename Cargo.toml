[workspace]
resolver = "2"
members = [
    "crates/holodeck-core",
    "crates/holodeck-stripe",
    "crates/holodeck-oauth",
    "crates/holodeck-storage",
    "crates/holodeck-notif",
    "crates/holodeck-server",
    "crates/holodeck-mcp",
    "crates/holodeck-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Khalid Farooq <wandererkhalid@gmail.com>"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/khalidfarooq/holodeck"
readme = "README.md"

[workspace.dependencies]
tokio = { version = "=1.39.3", features = ["full"] }
axum = { version = "0.7", features = ["multipart", "macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "=1.0.214", features = ["derive"] }
serde_json = "=1.0.128"
hmac = "0.12"
sha2 = "0.10"
hex = "=0.4.3"
reqwest = { version = "0.12", features = ["json"] }
thiserror = "=1.0.63"
tracing = "=0.1.40"
tracing-subscriber = { version = "=0.3.18", features = ["env-filter"] }
clap = { version = "=4.4.18", features = ["derive"] }
rand = "=0.8.5"
uuid = { version = "=1.11.0", features = ["v4", "serde"] }
chrono = { version = "=0.4.38", features = ["serde"] }
async-trait = "0.1"
holodeck-core = { path = "crates/holodeck-core" }
holodeck-stripe = { path = "crates/holodeck-stripe" }
holodeck-oauth = { path = "crates/holodeck-oauth" }
holodeck-storage = { path = "crates/holodeck-storage" }
holodeck-notif = { path = "crates/holodeck-notif" }
holodeck-server = { path = "crates/holodeck-server" }
holodeck-mcp = { path = "crates/holodeck-mcp" }
